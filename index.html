<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>世界フリック旅行</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#eef2f7; --card:#ffffff; --ink:#15233b; --muted:#6b7890;
  --red:#d7263d; --blue:#1b4f9c; --ok:#1f8a5b; --line:#d6deea; --soft:#e3e9f2;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0f1726; --card:#18233a; --ink:#e8eef8; --muted:#8b98b0;
    --red:#ff5a6e; --blue:#6f9df0; --ok:#4fd19a; --line:#2a3854; --soft:#223049;
  }
}
:root[data-theme="dark"]{
  --paper:#0f1726; --card:#18233a; --ink:#e8eef8; --muted:#8b98b0;
  --red:#ff5a6e; --blue:#6f9df0; --ok:#4fd19a; --line:#2a3854; --soft:#223049;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);
  font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",sans-serif;
  -webkit-tap-highlight-color:transparent}
.wrap{max-width:520px;margin:0 auto;padding:16px 16px 40px}
.display{font-family:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;font-weight:400}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.hidden{display:none!important}

.airmail{position:relative;border-radius:12px;background:var(--card);border:1px solid var(--line)}
.airmail>.inner{border-radius:12px;padding:12px}

/* ホーム */
.title{font-size:34px;line-height:1.15;margin:12px 0 4px;letter-spacing:.02em}
.lead{color:var(--muted);margin:0 0 20px;font-size:15px;line-height:1.7}
.modes{display:grid;gap:12px}
.mode{display:flex;gap:14px;align-items:center;text-align:left;width:100%;
  background:var(--card);border:2px solid var(--line);border-radius:12px;padding:16px}
.mode:active{transform:scale(.98)}
.mode .ic{font-size:34px;width:52px;height:52px;display:grid;place-items:center;background:var(--soft);border-radius:10px;flex:none}
.mode b{display:block;font-size:18px}
.mode small{color:var(--muted);font-size:13px}
.how{margin-top:22px;font-size:14px;line-height:1.8;color:var(--muted)}
.how p{margin:0 0 6px}
.how .rule{color:var(--ink);font-weight:700;background:var(--soft);border-radius:10px;padding:10px 12px;margin-top:10px}

/* ゲーム：キーボードが出ても画面内に収まるよう、見えている範囲に合わせて固定 */
body.playing{overflow:hidden}
#game{position:fixed;left:0;right:0;top:0;height:var(--vvh,100%);transform:translateY(var(--vvt,0px));
  display:flex;flex-direction:column;justify-content:flex-end;gap:8px;max-width:520px;margin:0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px;background:var(--paper);z-index:5}
.prog.warn{color:var(--red);font-weight:700}
.bar{display:flex;align-items:center;justify-content:space-between;flex:none}
.quit{background:none;border:1px solid var(--line);border-radius:999px;padding:4px 12px;font-size:13px;color:var(--muted)}
.prog{font-size:13px;color:var(--muted)}
.clock{font-size:20px;font-variant-numeric:tabular-nums}
#game .airmail{flex:none}
#game .airmail>.inner{display:flex;flex-direction:column}
.qtext{font-size:17px;line-height:1.5;font-weight:700;margin:0 0 4px;flex:none}
.who{font-size:14px;color:var(--blue);font-weight:700;margin:0 0 8px;flex:none}
.photo{flex:none;height:clamp(70px,calc(var(--vvh,100vh) - 360px),240px);border-radius:8px;overflow:hidden;margin-bottom:8px;position:relative}
.photo svg,.intro svg,.photo img,.intro img{display:block;width:100%;height:100%}
.ph{position:relative;width:100%;height:100%;overflow:hidden}
.ph .blur{position:absolute;inset:0;object-fit:cover;filter:blur(16px) brightness(.9);transform:scale(1.25)}
.ph .main{position:relative;object-fit:contain}
.intro .credit{display:block;margin-top:8px;font-size:11px;font-style:normal;color:var(--muted)}
.intro .credit a{color:inherit}
.photo span{position:absolute;right:8px;bottom:6px;font-size:11px;color:#fff;background:rgba(0,0,0,.35);padding:2px 8px;border-radius:999px}
.spot{font-size:22px;font-weight:700;margin:0;flex:none}
.country{font-size:13px;color:var(--muted);margin:0 0 8px;flex:none}
.target{font-size:18px;line-height:1.75;letter-spacing:.03em;background:var(--soft);border-radius:8px;padding:8px 10px;word-break:break-all;flex:none}
.target .c{color:var(--muted)}
.target .d{color:var(--ok)}
.target .n{color:var(--ink);border-bottom:3px solid var(--blue)}
.target .x{color:#fff;background:var(--red);border-radius:3px}
.target .sep{display:inline-block;width:.8em;color:var(--muted)}
.answer{flex:none;width:100%;font:inherit;font-size:18px;padding:10px 12px;border-radius:10px;
  border:2px solid var(--line);background:var(--card);color:var(--ink)}
.answer.bad{border-color:var(--red)}
.field{position:relative;flex:none}
.field .answer{color:transparent;caret-color:transparent}
.field .answer::selection{background:transparent}
.typed{position:absolute;left:14px;right:14px;top:50%;transform:translateY(-50%);font-size:18px;
  white-space:nowrap;overflow:hidden;pointer-events:none;color:var(--ink)}
.typed:empty::before{content:"ここに打つ（青い線が次の文字）";color:var(--muted)}
.count{position:absolute;inset:0;border-radius:12px;background:var(--card);display:grid;place-items:center;font-size:72px;color:var(--red);z-index:2}

/* 結果 */
.stamp{width:170px;height:170px;border-radius:50%;margin:10px auto 14px;border:4px double var(--red);
  display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--red);transform:rotate(-8deg)}
.stamp .t{font-size:40px;line-height:1}
.stamp small{font-size:13px;margin-top:6px}
.new{text-align:center;color:var(--red);font-weight:700;margin:0 0 6px}
.stats{display:flex;justify-content:center;gap:26px;margin:4px 0 18px;text-align:center}
.stats b{display:block;font-size:22px}
.stats small{color:var(--muted);font-size:12px}
.list{list-style:none;padding:0;margin:0 0 20px;border-top:1px solid var(--line)}
.list li{display:flex;justify-content:space-between;gap:12px;padding:10px 2px;border-bottom:1px solid var(--line);font-size:14px}
.list li span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list li span:last-child{font-variant-numeric:tabular-nums;flex:none}
.intros{list-style:none;padding:0;margin:0 0 20px;display:grid;gap:14px}
.intro{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.intro .pic{height:200px}
.intro .body{padding:12px 14px 14px}
.intro .head{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.intro .head b{font-size:18px}
.intro .head span{font-variant-numeric:tabular-nums;color:var(--blue);font-weight:700;flex:none}
.intro small{color:var(--muted);font-size:13px}
.intro p{margin:6px 0 0;font-size:14px;line-height:1.75}
.btns{display:grid;gap:10px}
.primary{background:var(--blue);color:#fff;border:none;border-radius:12px;padding:16px;font-size:17px;font-weight:700}
.ghost{background:none;border:2px solid var(--line);border-radius:12px;padding:14px;font-size:15px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">

  <!-- ホーム -->
  <section id="home">
    <h1 class="title display">世界フリック旅行</h1>
    <p class="lead">世界の名言や名所を、ひらがなでどれだけ速く打てるか。10問のトータルタイムで勝負しよう。</p>
    <div class="modes">
      <button class="mode" data-mode="quote">
        <div class="ic">📜</div>
        <div><b>名言モード</b><small id="best-quote">自己ベスト：まだなし</small></div>
      </button>
      <button class="mode" data-mode="spot">
        <div class="ic">🗺️</div>
        <div><b>名所モード</b><small id="best-spot">自己ベスト：まだなし</small></div>
      </button>
    </div>
    <div class="how">
      <p>表示されたひらがなを、そのまま打ち写してね。名言モードは名言のあとに、言った人の名前まで打つとクリア。</p>
      <p>漢字に変換しなくてOK。句読点やスペースは打たなくて大丈夫。</p>
      <p class="rule">ルール：予測変換は使わずに、自分の指で打ち切ろう。速くなるほど、世界の名言や名所も自然と覚えられるよ。</p>
    </div>
  </section>

  <!-- ゲーム -->
  <section id="game" class="hidden">
    <div class="airmail">
      <div class="count display hidden" id="count">3</div>
      <div class="inner" id="card"></div>
    </div>
    <div class="bar">
      <button class="quit" id="quit">やめる</button>
      <span class="prog" id="prog">1 / 10</span>
      <span class="clock display" id="clock">0.00</span>
    </div>
    <div class="field">
    <input class="answer" id="ans" type="text" lang="ja" inputmode="text"
      autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="done"
      aria-label="ここに入力">
    <span class="typed" id="typed"></span>
    </div>
  </section>

  <!-- 結果 -->
  <section id="result" class="hidden">
    <div class="stamp display"><span class="t" id="r-time">0.00</span><small>秒</small></div>
    <p class="new hidden" id="r-new">自己ベスト更新！</p>
    <div class="stats">
      <div><b id="r-cps">0.0</b><small>文字 / 秒</small></div>
      <div><b id="r-chars">0</b><small>打った文字数</small></div>
      <div><b id="r-best">-</b><small>自己ベスト</small></div>
    </div>
    <ul class="list" id="r-list"></ul>
    <div class="btns">
      <button class="primary" id="again">もう一度あそぶ</button>
      <button class="ghost" id="home-btn">モードをえらぶ</button>
    </div>
  </section>
</div>

<!-- 名所の写真（Wikimedia Commons）の一覧。tools/fetch_photos.py が作る -->
<script src="photos.js"></script>
<script>

    R(110,80,100,42,"#fbf8fc")+PA("M150 122 V98 Q160 86 170 98 V122Z","#d9cfe0")+
    C(120,80,9,"#fbf8fc")+C(200,80,9,"#fbf8fc")+PA("M126 82 Q124 42 160 32 Q196 42 194 82Z","#ffffff")+

  colosseum:()=>{let a="";for(const y of [78,103,128])for(let x=52;x<262;x+=22)a+=PA(`M${x} ${y+18} V${y+6} Q${x+7} ${y-2} ${x+14} ${y+6} V${y+18}Z`,"#9b6a45");

/* 本物の写真は photos.js の PHOTOS から読む（写真・撮影者・ライセンス）。無ければイラストを出す */
const PHOTO_LIST = (typeof PHOTOS === "object" && PHOTOS) ? PHOTOS : {};
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function creditOf(ph){
  const lic = ph.licenseUrl ? '<a href="'+esc(ph.licenseUrl)+'" target="_blank" rel="noopener">'+esc(ph.license)+'</a>' : esc(ph.license);
  const who = ph.page ? '<a href="'+esc(ph.page)+'" target="_blank" rel="noopener">'+esc(ph.author)+'</a>' : esc(ph.author);
  return "写真："+who+"（"+lic+"）／Wikimedia Commons";
}
function pic(q){
  const ph = PHOTO_LIST[q.art];
  if(!ph) return {html:(ART[q.art]||ART_WORLD)(), label:"イラスト", credit:""};
  return {html:'<div class="ph"><img class="blur" src="'+esc(ph.src)+'" alt=""><img class="main" src="'+esc(ph.src)+'" alt="'+esc(q.n)+'"></div>', label:"写真", credit:creditOf(ph)};
}

  {n:"ポタラ宮", c:"中国・チベット", r:"ぽたらきゅう", art:"potala", d:"標高約3700mに建つ宮殿。チベット仏教の指導者ダライ・ラマが住んでいた。"},

  {n:"エベレスト", c:"ネパール・中国", r:"えべれすと", art:"everest", d:"標高8848mの世界一高い山。1953年にヒラリーとテンジンが初めて頂上に立った。"},
  {n:"黄金寺院", c:"インド", r:"おうごんじいん", art:"goldentemple", d:"シク教のいちばん大切な寺院。金色の建物が池の真ん中に建ち、だれでも無料で食事をいただける。"},

  {n:"テーブルマウンテン", c:"南アフリカ", r:"てーぶるまうんてん", art:"tablemtn", d:"ケープタウンの町の後ろにそびえる、てっぺんが平らな山。山頂までロープウェイで登れる。"},
  {n:"アブ・シンベル神殿", c:"エジプト", r:"あぶしんべるしんでん", art:"abusimbel", d:"ラムセス2世が造らせた岩の神殿。ダムの湖に沈むのを防ぐため、1960年代に神殿ごと移された。"},

  {n:"グランドキャニオン", c:"アメリカ", r:"ぐらんどきゃにおん", art:"grandcanyon", d:"コロラド川が長い時間をかけて大地をけずってできた大峡谷。深いところは約1.8kmもある。"},
  {n:"ナイアガラの滝", c:"アメリカ・カナダ", r:"ないあがらのたき", art:"niagara", d:"アメリカとカナダの国境にある滝。船に乗って、滝のすぐ近くまで行くことができる。"},
  {n:"ラシュモア山", c:"アメリカ", r:"らしゅもあさん", art:"rushmore", d:"岩山に4人の大統領の顔がほられている。ワシントン、ジェファーソン、セオドア・ルーズベルト、リンカーンの顔。"},
  {n:"イエローストーン国立公園", c:"アメリカ", r:"いえろーすとーんこくりつこうえん", art:"yellowstone", d:"1872年にできた世界で最初の国立公園。間欠泉がたくさんあり、熱いお湯がふき出す。"},
  {n:"ホワイトハウス", c:"アメリカ・ワシントン", r:"ほわいとはうす", art:"whitehouse", d:"アメリカの大統領が住み、仕事をする建物。1800年から大統領の住まいとして使われている。"},
  {n:"エンパイア・ステート・ビル", c:"アメリカ・ニューヨーク", r:"えんぱいあすてーとびる", art:"empire", d:"1931年に完成した102階建てのビル。完成から約40年間、世界一高いビルだった。"},
  {n:"チチェン・イッツァ", c:"メキシコ", r:"ちちぇんいっつぁ", art:"chichen", d:"マヤ文明の遺跡。ピラミッド「エル・カスティーヨ」では、春分と秋分の日にへびの影が階段に現れる。"},
  {n:"コルコバードのキリスト像", c:"ブラジル", r:"こるこばーどのきりすとぞう", art:"christ", d:"リオデジャネイロの山の上に立つ、高さ約30mのキリスト像。1931年に完成した。"},
  {n:"イグアスの滝", c:"アルゼンチン・ブラジル", r:"いぐあすのたき", art:"iguazu", d:"大小275ほどの滝が集まった世界最大級の滝。いちばん迫力のある場所は「悪魔の喉笛」と呼ばれる。"},
  {n:"ウユニ塩湖", c:"ボリビア", r:"うゆにえんこ", art:"uyuni", d:"標高約3700mに広がる真っ白な塩の大地。雨のあとは水が張り、空が鏡のように映る。"},
  {n:"テオティワカン", c:"メキシコ", r:"ておてぃわかん", art:"teotihuacan", d:"メキシコシティの近くにある古代都市の遺跡。大きな「太陽のピラミッド」と「月のピラミッド」がある。"},
  {n:"ペリト・モレノ氷河", c:"アルゼンチン", r:"ぺりともれのひょうが", art:"perito", d:"パタゴニアにある大きな氷河。高さ約60mの氷のかべがくずれ落ちる様子を見られる。"},
  {n:"モニュメント・バレー", c:"アメリカ", r:"もにゅめんとばれー", art:"monument", d:"赤い大地に岩の塔がそびえる場所。ナバホ族の土地にあり、西部劇の映画にたびたび登場した。"},
  {n:"エンジェルフォール", c:"ベネズエラ", r:"えんじぇるふぉーる", art:"angel", d:"落差約979mの世界一高い滝。見つけたパイロット、ジミー・エンジェルの名前がついている。"},
  {n:"グレートバリアリーフ", c:"オーストラリア", r:"ぐれーとばりありーふ", art:"reef", d:"長さ2000km以上つづく世界最大のサンゴ礁。宇宙からも見えるといわれる。"},
  {n:"ミルフォード・サウンド", c:"ニュージーランド", r:"みるふぉーどさうんど", art:"milford", d:"氷河がけずってできた深い入り江(フィヨルド)。切り立ったがけから滝が流れ落ちる。"},
  {n:"シドニー・ハーバーブリッジ", c:"オーストラリア", r:"しどにーはーばーぶりっじ", art:"harbour", d:"1932年に完成したアーチ橋。その形から「古いハンガー」というあだ名がある。"},
  {n:"ミラノ大聖堂", c:"イタリア", r:"みらのだいせいどう", art:"milan", d:"完成までに約500年かかった大聖堂。屋根の上には、とがった塔が135本も立っている。"},
  {n:"バッキンガム宮殿", c:"イギリス・ロンドン", r:"ばっきんがむきゅうでん", art:"buckingham", d:"イギリスの国王が住む宮殿。宮殿の前で行われる衛兵の交代式が人気。"},
  {n:"ハルシュタット", c:"オーストリア", r:"はるしゅたっと", art:"hallstatt", d:"湖と山にかこまれた小さな町。「世界一美しい湖畔の町」ともいわれ、昔は塩の産地として栄えた。"},
  {n:"ブルーモスク", c:"トルコ・イスタンブール", r:"ぶるーもすく", art:"bluemosque", d:"正式な名前はスルタンアフメト・モスク。中の壁を青いタイルが飾っていることから、この名で呼ばれる。"},
  {n:"ダイヤモンドヘッド", c:"アメリカ・ハワイ", r:"だいやもんどへっど", art:"diamondhead", d:"ワイキキの近くにある火山のあと。岩の中の光る結晶をダイヤモンドとまちがえたことから名づけられた。"},
  {n:"ロンドン・アイ", c:"イギリス・ロンドン", r:"ろんどんあい", art:"londoneye", d:"2000年に完成した高さ135mの大観覧車。1周約30分で、ロンドンの街を見渡せる。"},
  {n:"ウェストミンスター寺院", c:"イギリス・ロンドン", r:"うぇすとみんすたーじいん", art:"westminster", d:"イギリス国王の戴冠式が行われる教会。ニュートンやダーウィンなど、偉人のお墓もある。"},
  {n:"ハンガリー国会議事堂", c:"ハンガリー・ブダペスト", r:"はんがりーこっかいぎじどう", art:"budapest", d:"ドナウ川のほとりに建つ、1904年完成の大きな建物。ハンガリーでいちばん大きな建物のひとつ。"},
  {n:"鎌倉大仏", c:"日本・神奈川", r:"かまくらだいぶつ", art:"kamakura", d:"高さ約11mの青銅の大仏。大仏殿がなくなったため、今は外に座っている。"},
  {n:"アンテロープキャニオン", c:"アメリカ", r:"あんてろーぷきゃにおん", art:"antelope", d:"砂岩が水と風でけずられてできた細い谷。上から差しこむ光で、岩のかべがなみのように光る。"}
];
const ROUNDS = 10;
const SMALL = {"ぁ":"あ","ぃ":"い","ぅ":"う","ぇ":"え","ぉ":"お","っ":"つ","ゃ":"や","ゅ":"ゆ","ょ":"よ","ゎ":"わ"};

const $ = s => document.querySelector(s);
if(("ontouchstart" in window) || navigator.maxTouchPoints > 0) document.documentElement.classList.add("touch");
const ans = $("#ans");
let lastLen = 0, warnT = 0, penalties = 0;
let mode = "quote", qs = [], idx = 0, times = [], qStart = 0, running = false, locked = true, raf = 0, sepAt = -1, target = "";

function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }
function showBest(){
  for(const m of ["quote","spot"]){
    const b = parseFloat(store("flick-best-"+m));
    $("#best-"+m).textContent = isNaN(b) ? "自己ベスト：まだなし" : "自己ベスト：" + b.toFixed(2) + "秒";
  }
}
function show(id){ for(const s of ["home","game","result"]) $("#"+s).classList.toggle("hidden", s!==id); document.body.classList.toggle("playing", id==="game"); window.scrollTo(0,0); fit(); }
function fit(){
  const vv = window.visualViewport, r = document.documentElement.style;
  if(!vv){ r.setProperty("--vvh", window.innerHeight+"px"); return; }
  r.setProperty("--vvh", vv.height+"px");
  r.setProperty("--vvt", vv.offsetTop+"px");
  const inner = document.querySelector("#card"); if(inner) inner.scrollTop = inner.scrollHeight;
}
if(window.visualViewport){ visualViewport.addEventListener("resize", fit); visualViewport.addEventListener("scroll", fit); }
window.addEventListener("resize", fit);
function shuffle(a){ a = a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

function norm(s){
  return s.replace(/[ァ-ヶ]/g, c => String.fromCharCode(c.charCodeAt(0)-0x60))
          .replace(/[\s、。・，．,.!！?？「」『』〜]/g, "");
}
function base(c){ c = c.normalize("NFD").replace(/[゙゚]/g, ""); return SMALL[c] || c; }

function judge(input){
  let n = 0, err = false;
  for(let i=0;i<input.length;i++){
    if(i >= target.length){ err = true; break; }
    if(input[i] === target[i]){ n++; continue; }
    // 最後の1文字は濁点・小文字の切り替え途中を許す
    if(i === input.length-1 && base(input[i]) === base(target[i])) break;
    err = true; break;
  }
  return {n, err, done: input === target};
}

function renderTarget(n, err){
  let h = "";
  for(let i=0;i<target.length;i++){
    if(i === sepAt) h += '<span class="sep">／</span>';
    const cls = i < n ? "d" : (i === n ? (err ? "x" : "n") : "c");
    h += '<span class="'+cls+'">'+target[i]+'</span>';
  }
  $("#tgt").innerHTML = h;
}

function renderCard(){
  const q = qs[idx];
  let h = "";
  if(mode === "quote"){
    target = q.r + q.ar; sepAt = q.r.length;
    h += '<p class="qtext">「'+q.t+'」</p><p class="who">'+q.a+'</p>';
  }else{
    target = q.r; sepAt = -1;
    const pc = pic(q);
    h += '<div class="photo">'+pc.html+'<span>'+pc.label+'</span></div>';
    h += '<p class="spot">'+q.n+'</p><p class="country">'+q.c+'</p>';
  }
  h += '<div class="target" id="tgt"></div>';
  $("#card").innerHTML = h;
  $("#prog").textContent = (idx+1) + " / " + ROUNDS;
  renderTarget(0, false);
  $("#card").scrollTop = $("#card").scrollHeight;
}

function tick(){
  if(!running) return;
  const total = times.reduce((a,b)=>a+b,0) + (performance.now()-qStart)/1000;
  $("#clock").textContent = total.toFixed(2);
  raf = requestAnimationFrame(tick);
}

function start(m){
  mode = m;
  qs = shuffle(m === "quote" ? QUOTES : SPOTS).slice(0, ROUNDS);
  idx = 0; times = []; running = false; locked = true; penalties = 0;
  show("game");
  renderCard();
  $("#clock").textContent = "0.00";
  ans.value = ""; baseRaw = 0; lastLen = 0; $("#typed").textContent = "";
  ans.classList.remove("bad");
  ans.focus(); // タップ直後に呼んでキーボードを出す
  const cd = $("#count"); cd.classList.remove("hidden");
  let k = 3; cd.textContent = k;
  const iv = setInterval(() => {
    k--;
    if(k > 0){ cd.textContent = k; return; }
    clearInterval(iv); cd.classList.add("hidden");
    resetBase(); locked = false; running = true;
    qStart = performance.now(); tick();
    ans.focus();
  }, 650);
}

/* 入力欄は途中で消さない（消すとキーボードの変換状態とズレて誤判定になる）。
   代わりに「この問題はここから」という位置を覚えて、その後ろだけを判定する。 */
let baseRaw = 0;
function resetBase(){ baseRaw = ans.value.length; lastLen = 0; $("#typed").textContent = ""; }

function next(){
  times.push((performance.now()-qStart)/1000);
  idx++;
  resetBase();
  if(idx >= ROUNDS){ finish(); return; }
  renderCard(); ans.classList.remove("bad");
  qStart = performance.now();
}

ans.addEventListener("input", () => {
  if(baseRaw > ans.value.length) baseRaw = ans.value.length;
  if(locked){ resetBase(); return; }
  const raw = ans.value.slice(baseRaw);
  const v = norm(raw);
  lastLen = v.length;
  $("#typed").textContent = raw;
  const r = judge(v);
  renderTarget(r.n, r.err);
  ans.classList.toggle("bad", r.err);
  if(r.done) next();
});

function finish(){
  running = false; cancelAnimationFrame(raf);
  const total = times.reduce((a,b)=>a+b,0);
  const chars = qs.reduce((s,q)=> s + (mode==="quote" ? (q.r+q.ar).length : q.r.length), 0);
  const key = "flick-best-"+mode, prev = parseFloat(store(key));
  const isNew = isNaN(prev) || total < prev;
  if(isNew) store(key, total.toFixed(2));
  const best = isNew ? total : prev;
  $("#r-time").textContent = total.toFixed(2);
  $("#r-cps").textContent = (chars/total).toFixed(1);
  $("#r-chars").textContent = chars;
  $("#r-best").textContent = best.toFixed(2);
  $("#r-new").classList.toggle("hidden", !isNew || isNaN(prev));
  $("#r-list").className = mode === "spot" ? "intros" : "list";
  $("#r-list").innerHTML = mode === "spot"
    ? qs.map((q,i) => { const pc = pic(q); return '<li class="intro"><div class="pic">'+pc.html+'</div><div class="body">'+
        '<div class="head"><b>'+q.n+'</b><span>'+times[i].toFixed(2)+'秒</span></div>'+
        '<small>'+q.c+'</small><p>'+q.d+'</p>'+(pc.credit ? '<em class="credit">'+pc.credit+'</em>' : '')+'</div></li>'; }).join("")
    : qs.map((q,i) => '<li><span>'+q.a+'「'+q.t+'」</span><span>'+times[i].toFixed(2)+'秒</span></li>').join("");
  ans.blur();
  show("result");
  showBest();
}

document.querySelectorAll(".mode").forEach(b => b.addEventListener("click", () => start(b.dataset.mode)));
$("#quit").addEventListener("click", () => { running = false; locked = true; cancelAnimationFrame(raf); ans.blur(); show("home"); showBest(); });
$("#again").addEventListener("click", () => start(mode));
$("#home-btn").addEventListener("click", () => { show("home"); showBest(); });
showBest();
</script>
</body>
