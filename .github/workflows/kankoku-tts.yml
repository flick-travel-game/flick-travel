# フリック韓国語の 🔊 の 音声を 作る(手で 押した ときだけ 動く)。鍵は Secrets の GOOGLE_TTS_KEY
name: kankoku-tts
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "作る 数の 上限(0 = ぜんぶ)"
        default: "0"
      only:
        description: "この 旅だけ(例: krhan。空 = ぜんぶ)"
        default: ""
      voice:
        description: "声(空 = きほん)"
        default: ""
      redo:
        description: "ある 音も 作りなおす(1 = はい)"
        default: ""
      samples:
        description: "見本だけ 作る 声(カンマ区切り)"
        default: ""
permissions:
  contents: write
concurrency: kankoku-tts
jobs:
  make:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 音声を 作る
        env:
          GOOGLE_TTS_KEY: ${{ secrets.GOOGLE_TTS_KEY }}
        run: python3 tools/kankoku/tts_audio.py --limit "${{ inputs.limit }}" ${{ inputs.only && format('--only {0}', inputs.only) || '' }} ${{ inputs.voice && format('--voice {0}', inputs.voice) || '' }} ${{ inputs.redo == '1' && '--redo' || '' }} ${{ inputs.samples && format('--samples {0}', inputs.samples) || '' }}
      - name: 入れる
        run: |
          git config user.name flick-travel-game
          git config user.email flick-travel-game@users.noreply.github.com
          git add kankoku/audio tools/kankoku/voice-samples 2>/dev/null || git add kankoku/audio
          git diff --cached --quiet && exit 0
          git commit -m "フリック韓国語: 音声を 足した"
          git pull --rebase -q origin main
          git push origin HEAD:main
